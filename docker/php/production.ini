; Réglages PHP de production. Chargé en dernier (préfixe zz-) via
; /usr/local/etc/php/conf.d/, donc prioritaire sur les valeurs par défaut.

; --- Environnement ---------------------------------------------------------
; "E" est indispensable : sans lui $_ENV reste vide et toute la configuration
; de l'appli (DB_*, JWT_SECRET, CORS_ORIGIN...) — lue exclusivement via $_ENV —
; serait invisible une fois les variables injectées par Docker plutôt que par
; un fichier .env.
variables_order = "EGPCS"
date.timezone = UTC
expose_php = Off

; --- Erreurs ---------------------------------------------------------------
; Jamais d'erreur PHP renvoyée au client en prod : elles partent sur stderr,
; donc dans `docker compose logs`.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Limites ---------------------------------------------------------------
memory_limit = 256M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 8M

; --- OPcache ---------------------------------------------------------------
; validate_timestamps=0 : le code ne change jamais dans un conteneur immuable,
; inutile de re-stat les fichiers à chaque requête. Corollaire : un déploiement
; passe forcément par une reconstruction d'image + redémarrage du conteneur.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; --- Sessions / cookies ----------------------------------------------------
; L'appli n'utilise pas les sessions PHP (JWT + cookie httpOnly maison), mais
; ces valeurs évitent toute fuite si une extension en ouvrait une.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
