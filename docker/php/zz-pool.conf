; Pool php-fpm — surcharge www.conf de l'image officielle.
; Nommé zz-pool.conf pour être chargé après le zz-docker.conf de l'image.

[www]
; PIÈGE CLASSIQUE : par défaut php-fpm vide l'environnement des workers
; (clear_env = yes). Les variables passées par Docker (DB_HOST, JWT_SECRET...)
; n'arriveraient alors jamais jusqu'à $_ENV, et l'appli tomberait
; silencieusement sur ses valeurs par défaut de développement.
clear_env = no

; Renvoie les erreurs/warnings des workers vers la sortie du conteneur, sinon
; elles disparaissent purement et simplement.
catch_workers_output = yes
decorate_workers_output = no

; L'appli parle déjà JSON ; le ping/status sert au healthcheck Docker.
ping.path = /fpm-ping
ping.response = pong

pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle les workers pour éviter toute fuite mémoire cumulée sur un VPS
; mutualisé entre plusieurs projets.
pm.max_requests = 500
