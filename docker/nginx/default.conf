# nginx : sert le SPA React et transmet /api à php-fpm.
#
# Le TLS, la redirection HTTP→HTTPS et le certificat Let's Encrypt sont gérés
# en amont par Traefik : ce serveur n'écoute qu'en HTTP sur le réseau Docker
# interne et n'est jamais exposé directement sur le VPS.

# Traefik termine le TLS et transmet le protocole d'origine dans
# X-Forwarded-Proto. PHP considère $_SERVER['HTTPS'] comme actif dès que la
# valeur est non vide et différente de "off" : transmettre bêtement l'en-tête
# ferait donc passer une requête en clair pour du HTTPS. Cette map produit la
# valeur exacte attendue par PHP.
map $http_x_forwarded_proto $php_https_flag {
    default   "";
    "https"   "on";
}

# Idem pour le schéma affiché dans les URL générées (mails de vérification et
# de réinitialisation de mot de passe).
map $http_x_forwarded_proto $php_request_scheme {
    default   $scheme;
    "https"   "https";
    "http"    "http";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # --- Adresse IP réelle du client ---------------------------------------
    # Sans ça, REMOTE_ADDR vaudrait l'IP du conteneur Traefik pour TOUT LE
    # MONDE : la limitation de débit (RateLimitService) et l'historique de
    # connexion (AuthService) traiteraient alors l'ensemble des visiteurs comme
    # un seul client, et quelques échecs de connexion suffiraient à verrouiller
    # la plateforme entière. Les plages déclarées ici sont les réseaux privés
    # Docker : seul un proxy interne peut donc revendiquer une IP cliente.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Limite la taille des soumissions d'exercices / du contenu de cours écrit
    # depuis /admin. Le code des apprenants s'exécute côté client (Web Worker),
    # seul le résultat déjà capturé transite ici — quelques Ko suffiraient,
    # 2 Mo laisse de la marge pour les théories rédigées en Markdown.
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # --- Sonde de vie du conteneur (HEALTHCHECK Docker) --------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API : FastCGI vers php-fpm ---------------------------------------
    # `^~` : ce préfixe l'emporte sur les locations par expression régulière.
    location ^~ /api {
        include fastcgi_params;

        fastcgi_pass backend:9000;

        # L'appli est un contrôleur frontal unique : toutes les routes passent
        # par public/index.php, qui lit REQUEST_URI (fourni par fastcgi_params)
        # pour router. Ces chemins sont ceux du conteneur `backend`, pas de
        # celui-ci — nginx n'a donc besoin d'aucun fichier PHP en local, et
        # aucun `try_files` ne doit être fait ici.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_param HTTPS           $php_https_flag;
        fastcgi_param REQUEST_SCHEME  $php_request_scheme;

        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Assets versionnés -------------------------------------------------
    # Vite génère des noms contenant un hash de contenu : le fichier servi à une
    # URL donnée ne change jamais, il peut donc être mis en cache indéfiniment.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- SPA ---------------------------------------------------------------
    # index.html ne doit jamais être mis en cache : c'est lui qui référence le
    # bundle courant, et un cache navigateur le ferait pointer indéfiniment sur
    # les assets de la version précédente après un déploiement.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        # Le routage est fait côté client par react-router : toute URL inconnue
        # renvoie index.html plutôt qu'un 404 nginx.
        try_files $uri $uri/ /index.html;
    }
}
