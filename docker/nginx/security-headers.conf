# En-têtes de sécurité communs.
#
# Ce fichier est `include`-é dans CHAQUE location qui utilise add_header : en
# nginx, un add_header présent dans un bloc annule tous ceux hérités des blocs
# parents. Sans cette duplication explicite, les pages servies par les
# locations ci-dessous perdraient silencieusement les en-têtes du bloc server.

add_header X-Content-Type-Options   "nosniff"                                  always;
add_header X-Frame-Options          "SAMEORIGIN"                               always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

# ---------------------------------------------------------------------------
# Content-Security-Policy — LIVRÉE DÉSACTIVÉE, À ACTIVER APRÈS VÉRIFICATION
# ---------------------------------------------------------------------------
# C'est le meilleur verrou contre une exfiltration de données par le code JS
# soumis par un apprenant : `connect-src 'self'` empêche le bac à sable
# d'émettre la moindre requête vers un domaine tiers, en plus des APIs déjà
# neutralisées dans le Worker (frontend/src/utils/jsSandbox.js).
#
# Elle n'est pas active par défaut parce qu'elle n'a pas pu être vérifiée dans
# un vrai navigateur au moment de sa rédaction : une directive manquante ne
# casse pas le déploiement, elle casse l'éditeur ou l'exécution des exercices,
# silencieusement, en production. Procédure d'activation dans DEPLOIEMENT.md
# (§ « Activer la CSP ») : décommenter, `docker compose up -d --build web`,
# puis ouvrir la console du navigateur sur un exercice avec DOM et un exercice
# sans DOM, et vérifier qu'aucune violation n'est signalée.
#
# Justification directive par directive :
#   script-src 'unsafe-eval'   Monaco et les deux bacs à sable construisent du
#                              code avec `new Function`.
#   script-src 'unsafe-inline' l'iframe `srcdoc` des exercices DOM hérite de la
#                              CSP de la page parente et exécute un <script>
#                              en ligne.
#   script/worker-src blob:    runJs() crée son Worker depuis une URL blob:.
#   style-src 'unsafe-inline'  Monaco injecte ses styles en ligne.
#   connect-src 'self'         la directive qui compte : l'API est same-origin,
#                              donc rien d'autre n'a besoin de sortir.
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
