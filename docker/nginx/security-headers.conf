# En-têtes de sécurité communs.
#
# Ce fichier est `include`-é dans CHAQUE location qui utilise add_header : en
# nginx, un add_header présent dans un bloc annule tous ceux hérités des blocs
# parents. Sans cette duplication explicite, les pages servies par les
# locations ci-dessous perdraient silencieusement les en-têtes du bloc server.

add_header X-Content-Type-Options   "nosniff"                                  always;
add_header X-Frame-Options          "SAMEORIGIN"                               always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

# ---------------------------------------------------------------------------
# Content-Security-Policy
# ---------------------------------------------------------------------------
# `connect-src 'self'` est la directive qui compte : elle empêche le code JS
# soumis par un apprenant d'émettre la moindre requête vers un domaine tiers.
# C'est une seconde barrière, indépendante de la neutralisation des APIs réseau
# faite dans le bac à sable lui-même (frontend/src/utils/jsSandbox.js) : même si
# ce code était contourné, la CSP tiendrait toujours.
#
# Aucune exception pour un domaine externe n'est nécessaire : Monaco
# (utils/monacoSetup.js) et les polices (styles/fonts.css) sont empaquetés avec
# l'application. Ajouter un CDN ici affaiblirait directement la protection —
# préférer auto-héberger toute nouvelle ressource tierce.
#
# Justification des assouplissements, tous nécessaires et tous vérifiés :
#   script-src 'unsafe-eval'   Monaco et les deux bacs à sable construisent du
#                              code avec `new Function`.
#   script-src 'unsafe-inline' le <script> anti-FOUC d'index.html (thème
#                              clair/sombre appliqué avant le premier rendu) et
#                              le <script> de l'iframe `srcdoc` des exercices
#                              DOM, qui hérite de la CSP de la page parente.
#   script/worker-src blob:    runJs() crée son Worker depuis une URL blob:.
#   style-src 'unsafe-inline'  Monaco injecte ses styles en ligne.
#
# Vérifié dans Chrome sur un build identique à celui de production, servi avec
# cet en-tête exact, avec `report-uri` pour collecter les violations :
#   - chargement de l'application : 0 violation ;
#   - Worker créé depuis un Blob + `new Function` : exécution OK ;
#   - iframe `srcdoc` sandboxée avec <script> inline et accès DOM : OK ;
#   - chunk Monaco chargé à la demande + démarrage de ses workers : OK ;
#   - exfiltration `fetch(..., {mode:'no-cors'})`, WebSocket et image vers un
#     domaine tiers, depuis la page ET depuis le Worker : bloquées.
#
# Si une ressource externe devient réellement indispensable un jour, la
# procédure de revalidation est décrite dans DEPLOIEMENT.md (§ « Revalider la
# CSP »).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
