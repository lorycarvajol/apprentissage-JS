<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="420" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Ordre d'évaluation d'une expression</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="50" width="480" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="80" y="75" font-size="14" fill="#262b38">2 + <tspan fill="#ffffff" font-weight="700">3 * 4</tspan> &gt; 10 &amp;&amp; 5 !== 4</text>
  <rect x="118" y="60" width="42" height="20" rx="4" fill="#2e7daf"/>
  <text x="139" y="75" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">3 * 4</text>
  <text x="555" y="75" text-anchor="end" font-size="10" fill="#8991a3">×</text>

  <line x1="300" y1="90" x2="300" y2="112" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- step 2 -->
  <rect x="60" y="115" width="480" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="80" y="140" font-size="14" fill="#262b38"><tspan fill="#ffffff" font-weight="700">2 + 12</tspan> &gt; 10 &amp;&amp; 5 !== 4</text>
  <rect x="76" y="125" width="60" height="20" rx="4" fill="#2e7daf"/>
  <text x="106" y="140" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">2 + 12</text>
  <text x="555" y="140" text-anchor="end" font-size="10" fill="#8991a3">+</text>

  <line x1="300" y1="155" x2="300" y2="177" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- step 3 -->
  <rect x="60" y="180" width="480" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="80" y="205" font-size="14" fill="#262b38"><tspan fill="#ffffff" font-weight="700">14 &gt; 10</tspan> &amp;&amp; 5 !== 4</text>
  <rect x="76" y="190" width="66" height="20" rx="4" fill="#2e7daf"/>
  <text x="109" y="205" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">14 &gt; 10</text>
  <text x="555" y="205" text-anchor="end" font-size="10" fill="#8991a3">&gt;</text>

  <line x1="300" y1="220" x2="300" y2="242" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- step 4 -->
  <rect x="60" y="245" width="480" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="80" y="270" font-size="14" fill="#262b38">true &amp;&amp; <tspan fill="#ffffff" font-weight="700">5 !== 4</tspan></text>
  <rect x="150" y="255" width="72" height="20" rx="4" fill="#2e7daf"/>
  <text x="186" y="270" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">5 !== 4</text>
  <text x="555" y="270" text-anchor="end" font-size="10" fill="#8991a3">!==</text>

  <line x1="300" y1="285" x2="300" y2="307" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- step 5 -->
  <rect x="60" y="310" width="480" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="80" y="335" font-size="14" fill="#262b38"><tspan fill="#ffffff" font-weight="700">true &amp;&amp; true</tspan></text>
  <rect x="76" y="320" width="92" height="20" rx="4" fill="#2e7daf"/>
  <text x="122" y="335" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">true &amp;&amp; true</text>
  <text x="555" y="335" text-anchor="end" font-size="10" fill="#8991a3">&amp;&amp;</text>

  <line x1="300" y1="350" x2="300" y2="372" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- final -->
  <rect x="220" y="375" width="160" height="34" rx="17" fill="#d4edda"/>
  <text x="300" y="397" text-anchor="middle" font-size="15" font-weight="700" fill="#155724">true</text>
</svg>
