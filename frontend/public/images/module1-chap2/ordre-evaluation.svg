<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="640" height="500" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Ordre d'évaluation d'une expression</text>

  <defs>
    <marker id="oe-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- step 1 : 3 * 4 -->
  <text x="30" y="53" font-size="10.5" fill="#8991a3">ÉTAPE 1</text>
  <rect x="30" y="59" width="580" height="44" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="48" y="87" font-size="14" fill="#262b38">2 + <tspan fill="#2e7daf" font-weight="700">3 * 4</tspan> &gt; 10 &amp;&amp; 5 !== 4</text>
  <circle cx="580" cy="81" r="16" fill="#2e7daf"/>
  <text x="580" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">×</text>

  <line x1="320" y1="103" x2="320" y2="127" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oe-ap)"/>

  <!-- step 2 : 2 + 12 -->
  <text x="30" y="132" font-size="10.5" fill="#8991a3">ÉTAPE 2</text>
  <rect x="30" y="138" width="580" height="44" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="48" y="166" font-size="14" fill="#262b38"><tspan fill="#2e7daf" font-weight="700">2 + 12</tspan> &gt; 10 &amp;&amp; 5 !== 4</text>
  <circle cx="580" cy="160" r="16" fill="#2e7daf"/>
  <text x="580" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">+</text>

  <line x1="320" y1="182" x2="320" y2="206" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oe-ap)"/>

  <!-- step 3 : 14 > 10 -->
  <text x="30" y="211" font-size="10.5" fill="#8991a3">ÉTAPE 3</text>
  <rect x="30" y="217" width="580" height="44" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="48" y="245" font-size="14" fill="#262b38"><tspan fill="#2e7daf" font-weight="700">14 &gt; 10</tspan> &amp;&amp; 5 !== 4</text>
  <circle cx="580" cy="239" r="16" fill="#2e7daf"/>
  <text x="580" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">&gt;</text>

  <line x1="320" y1="261" x2="320" y2="285" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oe-ap)"/>

  <!-- step 4 : 5 !== 4 -->
  <text x="30" y="290" font-size="10.5" fill="#8991a3">ÉTAPE 4</text>
  <rect x="30" y="296" width="580" height="44" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="48" y="324" font-size="14" fill="#262b38">true &amp;&amp; <tspan fill="#2e7daf" font-weight="700">5 !== 4</tspan></text>
  <circle cx="580" cy="318" r="16" fill="#2e7daf"/>
  <text x="580" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">!==</text>

  <line x1="320" y1="340" x2="320" y2="364" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oe-ap)"/>

  <!-- step 5 : true && true -->
  <text x="30" y="369" font-size="10.5" fill="#8991a3">ÉTAPE 5</text>
  <rect x="30" y="375" width="580" height="44" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="48" y="403" font-size="14" fill="#2e7daf" font-weight="700">true &amp;&amp; true</text>
  <circle cx="580" cy="397" r="16" fill="#2e7daf"/>
  <text x="580" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">&amp;&amp;</text>

  <line x1="320" y1="419" x2="320" y2="443" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oe-ap)"/>

  <!-- final -->
  <rect x="250" y="446" width="140" height="38" rx="19" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="320" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#155724">true</text>
</svg>
