<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="320" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">L'état à synchroniser manuellement avec le DOM</text>

  <!-- state -->
  <rect x="230" y="50" width="140" height="50" rx="8" fill="#262b38"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#ffffff">état : panier</text>

  <!-- scattered DOM targets, tangled lines -->
  <g stroke="#c0392b" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M 250 100 C 150 140, 90 170, 80 220"/>
    <path d="M 280 100 C 220 150, 180 190, 170 240"/>
    <path d="M 320 100 C 380 150, 420 190, 430 240"/>
    <path d="M 350 100 C 450 140, 510 170, 520 220"/>
  </g>

  <g font-size="9.5">
    <rect x="30" y="222" width="100" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="80" y="243" text-anchor="middle" fill="#c0392b">#liste-panier</text>

    <rect x="130" y="242" width="100" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="180" y="263" text-anchor="middle" fill="#c0392b">#total</text>

    <rect x="380" y="242" width="100" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="430" y="263" text-anchor="middle" fill="#c0392b">#badge</text>

    <rect x="470" y="222" width="100" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="520" y="243" text-anchor="middle" fill="#c0392b">#compteur-nav</text>
  </g>

  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#8991a3">un changement d'état, quatre endroits du DOM à mettre à jour à la main — sans en oublier un seul</text>
</svg>
