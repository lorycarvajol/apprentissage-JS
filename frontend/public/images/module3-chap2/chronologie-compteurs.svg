<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Trois appels, trois compteurs indépendants</text>

  <line x1="40" y1="70" x2="640" y2="70" stroke="#d3d8e3" stroke-width="2"/>

  <!-- call 1 -->
  <g font-size="10.5">
    <circle cx="130" cy="70" r="5" fill="#2e7daf"/>
    <text x="130" y="55" text-anchor="middle" fill="#2e7daf">const a = creerCompteur()</text>
    <rect x="60" y="100" width="140" height="120" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <text x="130" y="120" text-anchor="middle" font-size="10" fill="#8991a3">environnement de a</text>
    <rect x="75" y="130" width="110" height="24" fill="#f0f7ff" stroke="#2e7daf"/>
    <text x="130" y="147" text-anchor="middle" fill="#2e7daf">compte = 0</text>
    <text x="130" y="175" text-anchor="middle" fill="#262b38">a() → 1</text>
    <text x="130" y="192" text-anchor="middle" fill="#262b38">a() → 2</text>
  </g>

  <!-- call 2 -->
  <g font-size="10.5">
    <circle cx="340" cy="70" r="5" fill="#2e7daf"/>
    <text x="340" y="55" text-anchor="middle" fill="#2e7daf">const b = creerCompteur()</text>
    <rect x="270" y="100" width="140" height="120" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <text x="340" y="120" text-anchor="middle" font-size="10" fill="#8991a3">environnement de b</text>
    <rect x="285" y="130" width="110" height="24" fill="#f0f7ff" stroke="#2e7daf"/>
    <text x="340" y="147" text-anchor="middle" fill="#2e7daf">compte = 0</text>
    <text x="340" y="175" text-anchor="middle" fill="#262b38">b() → 1</text>
  </g>

  <!-- call 3 -->
  <g font-size="10.5">
    <circle cx="550" cy="70" r="5" fill="#2e7daf"/>
    <text x="550" y="55" text-anchor="middle" fill="#2e7daf">const c = creerCompteur()</text>
    <rect x="480" y="100" width="140" height="120" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <text x="550" y="120" text-anchor="middle" font-size="10" fill="#8991a3">environnement de c</text>
    <rect x="495" y="130" width="110" height="24" fill="#f0f7ff" stroke="#2e7daf"/>
    <text x="550" y="147" text-anchor="middle" fill="#2e7daf">compte = 0</text>
    <text x="550" y="175" text-anchor="middle" fill="#8991a3">(pas encore appelée)</text>
  </g>

  <text x="340" y="265" text-anchor="middle" font-size="12" fill="#8991a3">chaque appel à creerCompteur() crée un nouvel environnement — a, b et c ne se voient jamais entre eux</text>
</svg>
