<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="280" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">this désigne l'instance qui a appelé la méthode</text>

  <defs>
    <marker id="ti-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <g font-size="11">
    <text x="120" y="70" text-anchor="middle" fill="#262b38">ana.seSaluer()</text>
    <text x="480" y="70" text-anchor="middle" fill="#262b38">leo.seSaluer()</text>
  </g>

  <!-- shared method -->
  <rect x="230" y="60" width="140" height="50" rx="8" fill="#262b38"/>
  <text x="300" y="90" text-anchor="middle" font-size="10" fill="#ffffff">seSaluer() { this... }</text>

  <line x1="150" y1="75" x2="235" y2="80" stroke="#8991a3" stroke-width="1.5" marker-end="url(#ti-ap)"/>
  <line x1="450" y1="75" x2="365" y2="80" stroke="#8991a3" stroke-width="1.5" marker-end="url(#ti-ap)"/>

  <!-- this arrows to instances -->
  <path d="M 260 110 C 220 160, 150 180, 120 200" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#ti-ap)"/>
  <text x="180" y="165" text-anchor="middle" font-size="9" fill="#2e7daf">this</text>

  <path d="M 340 110 C 380 160, 450 180, 480 200" fill="none" stroke="#155724" stroke-width="2" marker-end="url(#ti-ap)"/>
  <text x="420" y="165" text-anchor="middle" font-size="9" fill="#155724">this</text>

  <!-- instances -->
  <g font-size="10">
    <rect x="45" y="205" width="150" height="50" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="120" y="235" text-anchor="middle" fill="#2e7daf">ana { nom: "Ana" }</text>

    <rect x="405" y="205" width="150" height="50" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="480" y="235" text-anchor="middle" fill="#155724">leo { nom: "Léo" }</text>
  </g>
</svg>
