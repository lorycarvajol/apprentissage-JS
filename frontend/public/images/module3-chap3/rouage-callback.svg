<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Une fonction d'ordre supérieur reçoit un callback</text>

  <defs>
    <marker id="rc-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <text x="90" y="150" text-anchor="middle" font-size="11" fill="#2e7daf">repeter(3, callback)</text>
  <line x1="30" y1="165" x2="130" y2="165" stroke="#8991a3" stroke-width="1.5" marker-end="url(#rc-ap)"/>

  <!-- big gear -->
  <g transform="translate(280,165)">
    <circle r="95" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <g fill="#e4e7ee">
      <rect x="-8" y="-103" width="16" height="18"/>
      <rect x="-8" y="85" width="16" height="18"/>
      <rect x="-103" y="-8" width="18" height="16"/>
      <rect x="85" y="-8" width="18" height="16"/>
      <rect x="-75" y="-75" width="16" height="16" transform="rotate(45 -67 -67)"/>
      <rect x="59" y="-75" width="16" height="16" transform="rotate(45 67 -67)"/>
      <rect x="-75" y="59" width="16" height="16" transform="rotate(45 -67 67)"/>
      <rect x="59" y="59" width="16" height="16" transform="rotate(45 67 67)"/>
    </g>
    <text y="-30" text-anchor="middle" font-size="11" fill="#262b38">repeter(n, callback) {</text>
    <text y="-12" text-anchor="middle" font-size="10" fill="#262b38">for (...) {</text>

    <!-- nested small gear = callback -->
    <g transform="translate(0,18)">
      <circle r="34" fill="#ffffff" stroke="#2e7daf" stroke-width="2"/>
      <g fill="#d7ecff">
        <rect x="-5" y="-38" width="10" height="10"/>
        <rect x="-5" y="28" width="10" height="10"/>
        <rect x="-38" y="-5" width="10" height="10"/>
        <rect x="28" y="-5" width="10" height="10"/>
      </g>
      <text y="0" text-anchor="middle" font-size="9" fill="#2e7daf">callback</text>
      <text y="13" text-anchor="middle" font-size="9" fill="#2e7daf">(i)</text>
    </g>

    <text y="72" text-anchor="middle" font-size="10" fill="#262b38">} }</text>
  </g>

  <line x1="375" y1="165" x2="475" y2="165" stroke="#8991a3" stroke-width="1.5" marker-end="url(#rc-ap)"/>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#155724">Tour 1</text>
  <text x="520" y="165" text-anchor="middle" font-size="11" fill="#155724">Tour 2</text>
  <text x="520" y="180" text-anchor="middle" font-size="11" fill="#155724">Tour 3</text>

  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#8991a3">repeter() ne connaît pas le contenu de callback — elle sait juste quand l'appeler</text>
</svg>
