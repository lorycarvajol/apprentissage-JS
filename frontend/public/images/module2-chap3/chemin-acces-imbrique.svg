<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">commande.client.adresse.ville</text>

  <defs>
    <marker id="ai" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <!-- level 1: commande -->
  <rect x="10" y="70" width="130" height="60" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="75" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7daf">commande</text>
  <text x="75" y="112" text-anchor="middle" font-size="9" fill="#8991a3">{ id, client }</text>

  <line x1="140" y1="100" x2="175" y2="100" stroke="#2e7daf" stroke-width="2" marker-end="url(#ai)"/>
  <text x="157" y="90" text-anchor="middle" font-size="10" fill="#8991a3">.client</text>

  <!-- level 2: client -->
  <rect x="180" y="70" width="130" height="60" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="245" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7daf">client</text>
  <text x="245" y="112" text-anchor="middle" font-size="9" fill="#8991a3">{ nom, adresse }</text>

  <line x1="310" y1="100" x2="345" y2="100" stroke="#2e7daf" stroke-width="2" marker-end="url(#ai)"/>
  <text x="327" y="90" text-anchor="middle" font-size="10" fill="#8991a3">.adresse</text>

  <!-- level 3: adresse -->
  <rect x="350" y="70" width="130" height="60" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="415" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7daf">adresse</text>
  <text x="415" y="112" text-anchor="middle" font-size="9" fill="#8991a3">{ ville, codePostal }</text>

  <line x1="480" y1="100" x2="515" y2="100" stroke="#2e7daf" stroke-width="2" marker-end="url(#ai)"/>
  <text x="497" y="90" text-anchor="middle" font-size="10" fill="#8991a3">.ville</text>

  <!-- final value -->
  <rect x="520" y="75" width="110" height="50" rx="25" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="575" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#155724">"Lyon"</text>

  <text x="320" y="180" text-anchor="middle" font-size="12" fill="#8991a3">chaque point ouvre l'objet suivant, jusqu'à la valeur finale</text>
</svg>
