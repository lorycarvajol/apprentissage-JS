<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="480" height="200" fill="#ffffff"/>
  <text x="240" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">const fruits = ["pomme", "banane", "kiwi"]</text>

  <g>
    <rect x="60" y="55" width="120" height="60" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <rect x="180" y="55" width="120" height="60" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <rect x="300" y="55" width="120" height="60" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>

    <text x="120" y="90" text-anchor="middle" font-size="13" fill="#262b38">"pomme"</text>
    <text x="240" y="90" text-anchor="middle" font-size="13" fill="#262b38">"banane"</text>
    <text x="360" y="90" text-anchor="middle" font-size="13" fill="#262b38">"kiwi"</text>

    <rect x="60" y="115" width="120" height="26" fill="#2e7daf"/>
    <rect x="180" y="115" width="120" height="26" fill="#2e7daf"/>
    <rect x="300" y="115" width="120" height="26" fill="#2e7daf"/>
    <text x="120" y="133" text-anchor="middle" font-size="12" fill="#ffffff">fruits[0]</text>
    <text x="240" y="133" text-anchor="middle" font-size="12" fill="#ffffff">fruits[1]</text>
    <text x="360" y="133" text-anchor="middle" font-size="12" fill="#ffffff">fruits[2]</text>
  </g>

  <text x="240" y="170" text-anchor="middle" font-size="12" fill="#8991a3">fruits.length === 3 — le dernier indice valide est toujours length - 1</text>
</svg>
