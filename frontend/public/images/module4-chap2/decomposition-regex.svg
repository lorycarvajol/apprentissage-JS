<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Décomposer /^[^\s@]+@[^\s@]+\.[^\s@]+$/</text>

  <g font-size="13">
    <text x="40" y="70" fill="#262b38">^</text>
    <text x="70" y="70" fill="#262b38">[^\s@]+</text>
    <text x="175" y="70" fill="#262b38">@</text>
    <text x="200" y="70" fill="#262b38">[^\s@]+</text>
    <text x="305" y="70" fill="#262b38">\.</text>
    <text x="335" y="70" fill="#262b38">[^\s@]+</text>
    <text x="440" y="70" fill="#262b38">$</text>
  </g>

  <!-- annotations -->
  <g font-size="10">
    <line x1="45" y1="80" x2="45" y2="100" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="45" y="115" text-anchor="middle" fill="#2e7daf">début</text>
    <text x="45" y="128" text-anchor="middle" fill="#2e7daf">de la chaîne</text>

    <line x1="105" y1="80" x2="105" y2="100" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="105" y="115" text-anchor="middle" fill="#2e7daf">un ou plusieurs</text>
    <text x="105" y="128" text-anchor="middle" fill="#2e7daf">caractères sans</text>
    <text x="105" y="141" text-anchor="middle" fill="#2e7daf">espace ni @</text>

    <line x1="177" y1="80" x2="177" y2="100" stroke="#c0392b" stroke-width="1.5"/>
    <text x="177" y="115" text-anchor="middle" fill="#c0392b">le @</text>
    <text x="177" y="128" text-anchor="middle" fill="#c0392b">littéral</text>

    <line x1="235" y1="80" x2="235" y2="100" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="235" y="115" text-anchor="middle" fill="#2e7daf">le nom de</text>
    <text x="235" y="128" text-anchor="middle" fill="#2e7daf">domaine</text>

    <line x1="312" y1="80" x2="312" y2="100" stroke="#c0392b" stroke-width="1.5"/>
    <text x="312" y="115" text-anchor="middle" fill="#c0392b">un point</text>
    <text x="312" y="128" text-anchor="middle" fill="#c0392b">littéral</text>

    <line x1="365" y1="80" x2="365" y2="100" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="365" y="115" text-anchor="middle" fill="#2e7daf">l'extension</text>
    <text x="365" y="128" text-anchor="middle" fill="#2e7daf">(com, fr...)</text>

    <line x1="443" y1="80" x2="443" y2="100" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="443" y="115" text-anchor="middle" fill="#2e7daf">fin</text>
    <text x="443" y="128" text-anchor="middle" fill="#2e7daf">de la chaîne</text>
  </g>

  <rect x="20" y="180" width="640" height="100" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="11" fill="#155724">"ana@exemple.com" → ^ ok, "ana" ok, @ ok, "exemple" ok, . ok, "com" ok, $ ok → true</text>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#c0392b">"pas-un-email" → aucun @ trouvé dans la chaîne → false</text>
  <text x="340" y="255" text-anchor="middle" font-size="11" fill="#c0392b">"leo@site" → @ présent, mais aucun "." après → false</text>
</svg>
