<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">extends : une racine, plusieurs branches</text>

  <defs>
    <marker id="ah-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <!-- Animal root -->
  <rect x="220" y="60" width="120" height="50" rx="8" fill="#262b38"/>
  <text x="280" y="90" text-anchor="middle" font-size="12" fill="#ffffff">Animal</text>

  <line x1="260" y1="110" x2="150" y2="180" stroke="#2e7daf" stroke-width="2" marker-end="url(#ah-ap)"/>
  <line x1="300" y1="110" x2="410" y2="180" stroke="#2e7daf" stroke-width="2" marker-end="url(#ah-ap)"/>

  <text x="180" y="150" text-anchor="middle" font-size="9" fill="#2e7daf">extends</text>
  <text x="380" y="150" text-anchor="middle" font-size="9" fill="#2e7daf">extends</text>

  <!-- Chien -->
  <g font-size="10">
    <rect x="90" y="185" width="120" height="60" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="150" y="210" text-anchor="middle" font-weight="600" fill="#2e7daf">Chien</text>
    <text x="150" y="228" text-anchor="middle" font-size="9" fill="#2e7daf">seDeplacer()</text>
    <text x="150" y="240" text-anchor="middle" font-size="9" fill="#2e7daf">redéfinie</text>
  </g>

  <!-- Chat -->
  <g font-size="10">
    <rect x="350" y="185" width="120" height="60" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="410" y="210" text-anchor="middle" font-weight="600" fill="#155724">Chat</text>
    <text x="410" y="228" text-anchor="middle" font-size="9" fill="#155724">seDeplacer()</text>
    <text x="410" y="240" text-anchor="middle" font-size="9" fill="#155724">redéfinie</text>
  </g>

  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#8991a3">chaque branche hérite d'Animal et redéfinit ce qui lui est propre</text>
</svg>
