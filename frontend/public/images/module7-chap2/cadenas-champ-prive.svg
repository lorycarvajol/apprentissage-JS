<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Un champ privé ne s'atteint que par une méthode publique</text>

  <defs>
    <marker id="cp-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- sealed box -->
  <rect x="180" y="60" width="200" height="130" rx="12" fill="#262b38"/>
  <text x="280" y="105" text-anchor="middle" font-size="12" fill="#ffffff">#solde</text>
  <text x="280" y="125" text-anchor="middle" font-size="10" fill="#c7cbd6">privé, inaccessible</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#c7cbd6">depuis l'extérieur</text>

  <!-- padlock -->
  <g transform="translate(280,70)">
    <rect x="-14" y="0" width="28" height="20" rx="4" fill="#e8a33d"/>
    <path d="M -8 0 L -8 -10 A 8 8 0 0 1 8 -10 L 8 0" fill="none" stroke="#e8a33d" stroke-width="4"/>
  </g>

  <!-- public door -->
  <rect x="380" y="105" width="80" height="40" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="420" y="122" text-anchor="middle" font-size="9" fill="#155724">deposer()</text>
  <text x="420" y="136" text-anchor="middle" font-size="9" fill="#155724">retirer()</text>

  <line x1="380" y1="125" x2="382" y2="125" stroke="#155724"/>
  <line x1="330" y1="125" x2="378" y2="125" stroke="#155724" stroke-width="2"/>

  <!-- outside attempt blocked -->
  <line x1="130" y1="125" x2="176" y2="125" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="90" y="115" text-anchor="middle" font-size="9" fill="#c0392b">compte.#solde</text>
  <text x="90" y="140" text-anchor="middle" font-size="9" fill="#c0392b">SyntaxError ✗</text>

  <line x1="470" y1="125" x2="510" y2="125" stroke="#155724" stroke-width="2" marker-end="url(#cp-ap)"/>
  <text x="530" y="115" text-anchor="middle" font-size="9" fill="#155724">compte.</text>
  <text x="530" y="128" text-anchor="middle" font-size="9" fill="#155724">deposer(50)</text>
  <text x="530" y="141" text-anchor="middle" font-size="9" fill="#155724">✓</text>

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#8991a3">deposer()/retirer() sont la seule porte d'accès à #solde</text>
</svg>
