<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Même logique : cascade (if/else) vs branches à plat (switch)</text>

  <defs>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- LEFT: if/else cascade -->
  <text x="150" y="55" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2e7daf">if / else if / else</text>

  <polygon points="150,65 210,95 150,125 90,95" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="150" y="99" text-anchor="middle" font-size="10" fill="#262b38">note ≥ 16 ?</text>
  <line x1="210" y1="95" x2="260" y2="95" stroke="#155724" stroke-width="1.5" marker-end="url(#a4)"/>
  <rect x="262" y="80" width="80" height="30" rx="6" fill="#d4edda"/>
  <text x="302" y="99" text-anchor="middle" font-size="11" fill="#155724">Très bien</text>

  <line x1="150" y1="125" x2="150" y2="150" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="165" y="140" font-size="10" fill="#c0392b">non</text>

  <polygon points="150,150 210,180 150,210 90,180" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#262b38">note ≥ 12 ?</text>
  <line x1="210" y1="180" x2="260" y2="180" stroke="#155724" stroke-width="1.5" marker-end="url(#a4)"/>
  <rect x="262" y="165" width="60" height="30" rx="6" fill="#d4edda"/>
  <text x="292" y="184" text-anchor="middle" font-size="11" fill="#155724">Bien</text>

  <line x1="150" y1="210" x2="150" y2="235" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="165" y="225" font-size="10" fill="#c0392b">non</text>

  <rect x="105" y="235" width="90" height="30" rx="6" fill="#fff3cd"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" fill="#856404">Passable</text>

  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#8991a3">3 décisions imbriquées,</text>
  <text x="150" y="315" text-anchor="middle" font-size="10" fill="#8991a3">évaluées dans l'ordre</text>

  <!-- divider -->
  <line x1="400" y1="55" x2="400" y2="330" stroke="#e4e7ee" stroke-width="1.5"/>

  <!-- RIGHT: switch flat -->
  <text x="490" y="55" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2e7daf">switch (mention)</text>

  <rect x="450" y="75" width="80" height="34" rx="17" fill="#2e7daf"/>
  <text x="490" y="97" text-anchor="middle" font-size="11" fill="#ffffff">mention</text>

  <line x1="470" y1="109" x2="440" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="490" y1="109" x2="490" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="510" y1="109" x2="540" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="405" y="140" width="70" height="30" rx="6" fill="#d4edda"/>
  <text x="440" y="159" text-anchor="middle" font-size="10" fill="#155724">'TB'</text>
  <rect x="455" y="180" width="70" height="30" rx="6" fill="#d4edda"/>
  <text x="490" y="199" text-anchor="middle" font-size="10" fill="#155724">'Bien'</text>
  <rect x="505" y="140" width="70" height="30" rx="6" fill="#fff3cd"/>
  <text x="540" y="159" text-anchor="middle" font-size="10" fill="#856404">'Passable'</text>

  <text x="490" y="300" text-anchor="middle" font-size="10" fill="#8991a3">3 branches indépendantes,</text>
  <text x="490" y="315" text-anchor="middle" font-size="10" fill="#8991a3">une seule valeur comparée</text>
</svg>
