<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Même logique : cascade (if/else) vs branches à plat (switch)</text>

  <defs>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- LEFT: if/else cascade -->
  <text x="140" y="55" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2e7daf">if / else if / else</text>

  <polygon points="140,67 190,95 140,123 90,95" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="140" y="99" text-anchor="middle" font-size="10" fill="#262b38">note ≥ 16 ?</text>
  <line x1="192" y1="95" x2="234" y2="95" stroke="#155724" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="207" y="87" font-size="9.5" fill="#155724">oui</text>
  <rect x="248" y="80" width="90" height="30" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="293" y="99" text-anchor="middle" font-size="11" fill="#155724">Très bien</text>

  <line x1="140" y1="125" x2="140" y2="143" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="150" y="139" font-size="9.5" fill="#c0392b">non</text>

  <polygon points="140,151 190,179 140,207 90,179" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="140" y="183" text-anchor="middle" font-size="10" fill="#262b38">note ≥ 12 ?</text>
  <line x1="192" y1="179" x2="234" y2="179" stroke="#155724" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="207" y="171" font-size="9.5" fill="#155724">oui</text>
  <rect x="248" y="164" width="70" height="30" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="283" y="183" text-anchor="middle" font-size="11" fill="#155724">Bien</text>

  <line x1="140" y1="209" x2="140" y2="227" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="150" y="223" font-size="9.5" fill="#c0392b">non</text>

  <rect x="95" y="235" width="90" height="30" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#856404">Passable</text>

  <text x="140" y="300" text-anchor="middle" font-size="10.5" fill="#8991a3">3 décisions imbriquées,</text>
  <text x="140" y="317" text-anchor="middle" font-size="10.5" fill="#8991a3">évaluées dans l'ordre</text>

  <!-- divider -->
  <line x1="415" y1="55" x2="415" y2="330" stroke="#e4e7ee" stroke-width="1.5"/>

  <!-- RIGHT: switch flat -->
  <text x="560" y="55" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2e7daf">switch (mention)</text>

  <rect x="520" y="75" width="80" height="34" rx="17" fill="#2e7daf"/>
  <text x="560" y="97" text-anchor="middle" font-size="11" fill="#ffffff">mention</text>

  <line x1="535" y1="111" x2="486" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="560" y1="111" x2="560" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="585" y1="111" x2="634" y2="140" stroke="#8991a3" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="450" y="150" width="60" height="32" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="480" y="170" text-anchor="middle" font-size="10.5" fill="#155724">'TB'</text>

  <rect x="520" y="150" width="70" height="32" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="555" y="170" text-anchor="middle" font-size="10.5" fill="#155724">'Bien'</text>

  <rect x="600" y="150" width="90" height="32" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="645" y="170" text-anchor="middle" font-size="10.5" fill="#856404">'Passable'</text>

  <text x="560" y="300" text-anchor="middle" font-size="10.5" fill="#8991a3">3 branches indépendantes,</text>
  <text x="560" y="317" text-anchor="middle" font-size="10.5" fill="#8991a3">une seule valeur comparée</text>
</svg>
