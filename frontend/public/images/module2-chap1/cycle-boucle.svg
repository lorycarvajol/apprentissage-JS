<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Le cycle d'une boucle</text>

  <defs>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
    <marker id="ac-exit" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- exit node (far left) -->
  <rect x="40" y="85" width="120" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#c0392b">sortie de</text>
  <text x="100" y="121" text-anchor="middle" font-size="11" fill="#c0392b">la boucle</text>

  <!-- condition node (top center) -->
  <polygon points="280,76 340,110 280,144 220,110" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="280" y="106" text-anchor="middle" font-size="10" fill="#262b38">condition</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#262b38">vraie ?</text>

  <!-- body node (top right, same height as condition) -->
  <rect x="420" y="85" width="140" height="50" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="490" y="114" text-anchor="middle" font-size="11" fill="#155724">exécuter le bloc</text>

  <!-- increment node (bottom right, below body) -->
  <rect x="420" y="250" width="140" height="50" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="490" y="279" text-anchor="middle" font-size="11" fill="#262b38">avancer (i++)</text>

  <!-- exit arrow (horizontal, condition -> exit) -->
  <line x1="214" y1="110" x2="166" y2="110" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ac-exit)"/>
  <text x="190" y="99" text-anchor="middle" font-size="10" fill="#c0392b">non</text>

  <!-- condition -> body (horizontal) -->
  <line x1="346" y1="110" x2="414" y2="110" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>
  <text x="380" y="99" text-anchor="middle" font-size="10" fill="#155724">oui</text>

  <!-- body -> increment (vertical) -->
  <line x1="490" y1="141" x2="490" y2="244" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>

  <!-- increment -> condition (closes the loop) -->
  <line x1="420" y1="275" x2="288" y2="158" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>

  <text x="300" y="355" text-anchor="middle" font-size="12" fill="#8991a3">for / while : la condition est revérifiée à chaque tour</text>
</svg>
