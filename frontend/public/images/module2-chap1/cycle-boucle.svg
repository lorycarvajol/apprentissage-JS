<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#262b38">Le cycle d'une boucle</text>

  <defs>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <!-- circular path -->
  <circle cx="260" cy="190" r="110" fill="none" stroke="#e4e7ee" stroke-width="2"/>

  <!-- condition node (top) -->
  <polygon points="260,90 310,120 260,150 210,120" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#262b38">condition</text>
  <text x="260" y="130" text-anchor="middle" font-size="10" fill="#262b38">vraie ?</text>

  <!-- body node (right) -->
  <rect x="335" y="165" width="110" height="50" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="390" y="195" text-anchor="middle" font-size="11" fill="#155724">exécuter le bloc</text>

  <!-- increment node (bottom) -->
  <rect x="205" y="255" width="110" height="50" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="260" y="285" text-anchor="middle" font-size="11" fill="#262b38">avancer (i++)</text>

  <!-- arrows around the circle -->
  <path d="M 300 130 A 110 110 0 0 1 380 175" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>
  <path d="M 385 218 A 110 110 0 0 1 300 268" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>
  <path d="M 220 270 A 110 110 0 0 1 220 138" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#ac)"/>

  <!-- exit -->
  <line x1="215" y1="120" x2="90" y2="120" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#c0392b">non</text>
  <rect x="20" y="95" width="90" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="116" text-anchor="middle" font-size="11" fill="#c0392b">sortie de</text>
  <text x="65" y="130" text-anchor="middle" font-size="11" fill="#c0392b">la boucle</text>

  <text x="330" y="112" font-size="10" fill="#155724">oui</text>

  <text x="280" y="345" text-anchor="middle" font-size="12" fill="#8991a3">for / while : la condition est revérifiée à chaque tour</text>
</svg>
