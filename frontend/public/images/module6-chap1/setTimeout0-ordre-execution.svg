<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="620" height="260" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">setTimeout(fn, 0) n'exécute jamais immédiatement</text>

  <g font-size="11">
    <text x="30" y="70" fill="#262b38">console.log("1");</text>
    <text x="30" y="95" fill="#262b38">setTimeout(() =&gt; console.log("2"), 0);</text>
    <text x="30" y="120" fill="#262b38">console.log("3");</text>
  </g>

  <defs>
    <marker id="st-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <line x1="60" y1="160" x2="560" y2="160" stroke="#d3d8e3" stroke-width="2" marker-end="url(#st-ap)"/>

  <circle cx="100" cy="160" r="6" fill="#155724"/>
  <text x="100" y="145" text-anchor="middle" font-size="11" fill="#155724">"1"</text>
  <text x="100" y="185" text-anchor="middle" font-size="9" fill="#8991a3">ligne 1</text>

  <circle cx="220" cy="160" r="6" fill="#155724"/>
  <text x="220" y="145" text-anchor="middle" font-size="11" fill="#155724">"3"</text>
  <text x="220" y="185" text-anchor="middle" font-size="9" fill="#8991a3">ligne 3, avant le callback</text>

  <circle cx="470" cy="160" r="6" fill="#c0392b"/>
  <text x="470" y="145" text-anchor="middle" font-size="11" fill="#c0392b">"2"</text>
  <text x="470" y="185" text-anchor="middle" font-size="9" fill="#8991a3">callback, une fois la pile vide</text>

  <text x="310" y="230" text-anchor="middle" font-size="12" fill="#8991a3">ordre réel affiché : 1, 3, 2 — jamais 1, 2, 3</text>
</svg>
