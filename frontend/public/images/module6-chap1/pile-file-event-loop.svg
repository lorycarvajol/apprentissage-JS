<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Pile, file d'attente et boucle d'événements</text>

  <defs>
    <marker id="pf-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <!-- call stack -->
  <g font-size="10">
    <text x="110" y="55" text-anchor="middle" fill="#8991a3">pile d'exécution</text>
    <rect x="40" y="65" width="140" height="150" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <rect x="55" y="175" width="110" height="28" fill="#d4edda" stroke="#155724"/>
    <text x="110" y="193" text-anchor="middle" fill="#155724">console.log("1")</text>
    <text x="110" y="145" text-anchor="middle" fill="#8991a3">(vide entre</text>
    <text x="110" y="160" text-anchor="middle" fill="#8991a3">chaque tour)</text>
  </g>

  <!-- callback queue -->
  <g font-size="10">
    <text x="480" y="55" text-anchor="middle" fill="#8991a3">file d'attente</text>
    <rect x="410" y="65" width="140" height="150" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <rect x="425" y="80" width="110" height="28" fill="#fdecea" stroke="#c0392b"/>
    <text x="480" y="98" text-anchor="middle" fill="#c0392b">setTimeout callback</text>
    <rect x="425" y="115" width="110" height="28" fill="#fdecea" stroke="#c0392b"/>
    <text x="480" y="133" text-anchor="middle" fill="#c0392b">Promise.then callback</text>
  </g>

  <!-- event loop -->
  <g>
    <circle cx="295" cy="140" r="45" fill="none" stroke="#2e7daf" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="295" y="136" text-anchor="middle" font-size="10" fill="#2e7daf">boucle</text>
    <text x="295" y="150" text-anchor="middle" font-size="10" fill="#2e7daf">d'événements</text>
  </g>

  <path d="M 335 140 L 405 140" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#pf-ap)"/>
  <text x="370" y="130" text-anchor="middle" font-size="9" fill="#2e7daf">surveille</text>

  <path d="M 405 165 C 350 210, 230 210, 175 165" fill="none" stroke="#2e7daf" stroke-width="2" marker-end="url(#pf-ap)"/>
  <text x="290" y="215" text-anchor="middle" font-size="9" fill="#2e7daf">transfère dès que la pile est vide</text>

  <text x="310" y="280" text-anchor="middle" font-size="12" fill="#8991a3">un callback en file n'entre dans la pile que lorsqu'elle est totalement vide</text>
</svg>
