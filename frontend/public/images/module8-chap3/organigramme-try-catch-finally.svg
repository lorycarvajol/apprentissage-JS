<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="500" height="340" fill="#ffffff"/>
  <text x="250" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">try / catch / finally</text>

  <defs>
    <marker id="oc-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <rect x="180" y="45" width="140" height="40" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
  <text x="250" y="70" text-anchor="middle" font-size="11" fill="#262b38">try { ... }</text>

  <line x1="220" y1="85" x2="140" y2="130" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oc-ap)"/>
  <line x1="280" y1="85" x2="360" y2="130" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oc-ap)"/>
  <text x="150" y="115" text-anchor="middle" font-size="9" fill="#155724">succès</text>
  <text x="360" y="115" text-anchor="middle" font-size="9" fill="#c0392b">erreur</text>

  <rect x="60" y="135" width="140" height="40" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="130" y="160" text-anchor="middle" font-size="10" fill="#155724">reste du try</text>

  <rect x="300" y="135" width="140" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="160" text-anchor="middle" font-size="10" fill="#c0392b">catch (erreur)</text>

  <line x1="130" y1="175" x2="220" y2="220" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oc-ap)"/>
  <line x1="370" y1="175" x2="280" y2="220" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oc-ap)"/>

  <rect x="180" y="225" width="140" height="40" rx="8" fill="#262b38"/>
  <text x="250" y="250" text-anchor="middle" font-size="11" fill="#ffffff">finally { ... }</text>

  <line x1="250" y1="265" x2="250" y2="295" stroke="#8991a3" stroke-width="1.5" marker-end="url(#oc-ap)"/>
  <text x="250" y="315" text-anchor="middle" font-size="11" fill="#8991a3">suite du programme</text>
</svg>
