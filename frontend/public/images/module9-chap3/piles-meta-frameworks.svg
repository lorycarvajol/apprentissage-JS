<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Chaque méta-framework ajoute SSR, routing, API routes</text>

  <!-- stack 1: React + Next -->
  <g font-size="10.5">
    <rect x="40" y="180" width="120" height="50" rx="6" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="100" y="209" text-anchor="middle" fill="#2e7daf">React</text>
    <rect x="40" y="120" width="120" height="50" rx="6" fill="#2e7daf"/>
    <text x="100" y="149" text-anchor="middle" fill="#ffffff">Next.js</text>
  </g>

  <!-- stack 2: Vue + Nuxt -->
  <g font-size="10.5">
    <rect x="220" y="180" width="120" height="50" rx="6" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="280" y="209" text-anchor="middle" fill="#155724">Vue</text>
    <rect x="220" y="120" width="120" height="50" rx="6" fill="#155724"/>
    <text x="280" y="149" text-anchor="middle" fill="#ffffff">Nuxt</text>
  </g>

  <!-- stack 3: Svelte + SvelteKit -->
  <g font-size="10.5">
    <rect x="400" y="180" width="120" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="460" y="209" text-anchor="middle" fill="#c0392b">Svelte</text>
    <rect x="400" y="120" width="120" height="50" rx="6" fill="#c0392b"/>
    <text x="460" y="149" text-anchor="middle" fill="#ffffff">SvelteKit</text>
  </g>

  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#8991a3">Astro s'ajoute à part : agnostique du framework UI, orienté contenu</text>
</svg>
