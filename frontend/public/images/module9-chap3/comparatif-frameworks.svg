<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Quatre approches, deux axes de comparaison</text>

  <!-- axes -->
  <line x1="80" y1="290" x2="500" y2="290" stroke="#d3d8e3" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="290" stroke="#d3d8e3" stroke-width="1.5"/>

  <text x="290" y="315" text-anchor="middle" font-size="10" fill="#8991a3">librairie ←—————————→ framework complet</text>
  <text x="30" y="175" text-anchor="middle" font-size="10" fill="#8991a3" transform="rotate(-90 30 175)">compilé ←——→ virtual DOM</text>

  <!-- React -->
  <circle cx="150" cy="230" r="8" fill="#2e7daf"/>
  <text x="150" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7daf">React</text>
  <text x="150" y="250" text-anchor="middle" font-size="8" fill="#8991a3">librairie, virtual DOM</text>

  <!-- Vue -->
  <circle cx="260" cy="200" r="8" fill="#155724"/>
  <text x="260" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#155724">Vue</text>
  <text x="260" y="220" text-anchor="middle" font-size="8" fill="#8991a3">progressif, virtual DOM</text>

  <!-- Angular -->
  <circle cx="420" cy="150" r="8" fill="#c0392b"/>
  <text x="420" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#c0392b">Angular</text>
  <text x="420" y="170" text-anchor="middle" font-size="8" fill="#8991a3">framework complet</text>

  <!-- Svelte -->
  <circle cx="180" cy="100" r="8" fill="#e8a33d"/>
  <text x="180" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#e8a33d">Svelte</text>
  <text x="180" y="118" text-anchor="middle" font-size="8" fill="#8991a3">compilé au build</text>

  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#8991a3">toutes partagent le même socle : composant, props, réactivité</text>
</svg>
