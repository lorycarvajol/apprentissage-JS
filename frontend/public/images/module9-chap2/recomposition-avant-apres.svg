<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="260" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Changer l'état, puis recomposer</text>

  <defs>
    <marker id="rc-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- before -->
  <g font-size="11">
    <text x="120" y="60" text-anchor="middle" fill="#8991a3">avant</text>
    <rect x="40" y="70" width="160" height="60" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <text x="120" y="105" text-anchor="middle" fill="#262b38">Compteur : 0</text>
  </g>

  <line x1="200" y1="100" x2="250" y2="100" stroke="#8991a3" stroke-width="1.5" marker-end="url(#rc-ap)"/>
  <text x="225" y="88" text-anchor="middle" font-size="9" fill="#8991a3">incrementer()</text>
  <text x="225" y="120" text-anchor="middle" font-size="9" fill="#8991a3">x2</text>

  <!-- after -->
  <g font-size="11">
    <text x="410" y="60" text-anchor="middle" fill="#155724">après (recomposé)</text>
    <rect x="330" y="70" width="160" height="60" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="410" y="105" text-anchor="middle" fill="#155724">Compteur : 2</text>
  </g>

  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#8991a3">valeur++ change l'état ; rappeler render() produit le nouveau rendu</text>
  <text x="280" y="205" text-anchor="middle" font-size="12" fill="#8991a3">un vrai framework rappelle render() automatiquement, sans étape manuelle</text>
</svg>
