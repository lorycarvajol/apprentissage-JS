<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="560" height="240" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">Un composant : props en entrée, rendu en sortie</text>

  <defs>
    <marker id="cf-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <!-- props in -->
  <g font-size="10">
    <text x="90" y="80" text-anchor="middle" fill="#8991a3">props</text>
    <rect x="30" y="90" width="120" height="40" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="90" y="115" text-anchor="middle" fill="#2e7daf">{ texte, couleur }</text>
  </g>

  <line x1="150" y1="110" x2="200" y2="110" stroke="#8991a3" stroke-width="1.5" marker-end="url(#cf-ap)"/>

  <!-- component -->
  <rect x="205" y="65" width="150" height="90" rx="10" fill="#262b38"/>
  <text x="280" y="105" text-anchor="middle" font-size="11" fill="#ffffff">composantBouton</text>
  <text x="280" y="123" text-anchor="middle" font-size="9" fill="#c7cbd6">(fonction)</text>

  <line x1="355" y1="110" x2="405" y2="110" stroke="#8991a3" stroke-width="1.5" marker-end="url(#cf-ap)"/>

  <!-- render out -->
  <g font-size="10">
    <text x="470" y="80" text-anchor="middle" fill="#8991a3">rendu</text>
    <rect x="410" y="90" width="130" height="40" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="475" y="115" text-anchor="middle" font-size="9" fill="#155724">&lt;button&gt;Valider&lt;/button&gt;</text>
  </g>

  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#8991a3">la fonction ne change jamais — seules les props font varier le rendu</text>
</svg>
