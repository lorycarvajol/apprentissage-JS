<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="600" height="280" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">La même boucle, la même méthode, des classes différentes</text>

  <defs>
    <marker id="bf-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7daf"/>
    </marker>
  </defs>

  <!-- shapes row -->
  <circle cx="120" cy="150" r="40" fill="#f0f7ff" stroke="#2e7daf" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" font-size="10" fill="#2e7daf">Cercle</text>

  <rect x="260" y="110" width="80" height="80" fill="#d4edda" stroke="#155724" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" font-size="10" fill="#155724">Carré</text>

  <polygon points="480,110 440,190 520,190" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="170" text-anchor="middle" font-size="10" fill="#c0392b">Triangle</text>

  <!-- loop arc above -->
  <path d="M 60 70 A 240 60 0 0 1 540 70" fill="none" stroke="#8991a3" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#bf-ap)"/>
  <text x="300" y="55" text-anchor="middle" font-size="11" fill="#8991a3">for (const forme of formes)</text>

  <!-- shared label -->
  <line x1="120" y1="190" x2="120" y2="220" stroke="#2e7daf" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="300" y2="220" stroke="#155724" stroke-width="1.5"/>
  <line x1="480" y1="190" x2="480" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="220" y="225" width="160" height="30" rx="6" fill="#262b38"/>
  <text x="300" y="245" text-anchor="middle" font-size="11" fill="#ffffff">forme.aire()</text>
  <line x1="120" y1="220" x2="220" y2="240" stroke="#2e7daf" stroke-width="1.5"/>
  <line x1="480" y1="220" x2="380" y2="240" stroke="#c0392b" stroke-width="1.5"/>
</svg>
