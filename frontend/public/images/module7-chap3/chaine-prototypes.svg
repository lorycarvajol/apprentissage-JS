<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="680" height="220" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#262b38">La chaîne de prototypes</text>

  <defs>
    <marker id="chp-ap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8991a3"/>
    </marker>
  </defs>

  <g font-size="10.5">
    <rect x="15" y="80" width="110" height="50" rx="8" fill="#2e7daf"/>
    <text x="70" y="102" text-anchor="middle" fill="#ffffff">rex</text>
    <text x="70" y="118" text-anchor="middle" font-size="9" fill="#d7ecff">(instance)</text>

    <line x1="125" y1="105" x2="170" y2="105" stroke="#8991a3" stroke-width="1.5" marker-end="url(#chp-ap)"/>

    <rect x="175" y="80" width="130" height="50" rx="8" fill="#f0f7ff" stroke="#2e7daf" stroke-width="1.5"/>
    <text x="240" y="102" text-anchor="middle" fill="#2e7daf">Chien.prototype</text>
    <text x="240" y="118" text-anchor="middle" font-size="9" fill="#2e7daf">seDeplacer()</text>

    <line x1="305" y1="105" x2="350" y2="105" stroke="#8991a3" stroke-width="1.5" marker-end="url(#chp-ap)"/>

    <rect x="355" y="80" width="130" height="50" rx="8" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
    <text x="420" y="102" text-anchor="middle" fill="#155724">Animal.prototype</text>
    <text x="420" y="118" text-anchor="middle" font-size="9" fill="#155724">seDeplacer()</text>

    <line x1="485" y1="105" x2="530" y2="105" stroke="#8991a3" stroke-width="1.5" marker-end="url(#chp-ap)"/>

    <rect x="535" y="80" width="110" height="50" rx="8" fill="#f5f7fb" stroke="#d3d8e3" stroke-width="1.5"/>
    <text x="590" y="102" text-anchor="middle" fill="#262b38">Object.prototype</text>
    <text x="590" y="118" text-anchor="middle" font-size="9" fill="#8991a3">toString()...</text>
  </g>

  <line x1="645" y1="105" x2="670" y2="105" stroke="#8991a3" stroke-width="1.5" marker-end="url(#chp-ap)"/>
  <text x="670" y="102" font-size="11" fill="#8991a3">null</text>

  <text x="340" y="175" text-anchor="middle" font-size="12" fill="#8991a3">rex.seDeplacer() est trouvée dès Chien.prototype — la recherche s'arrête là</text>
