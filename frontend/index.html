<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plateforme d'apprentissage JavaScript - Apprenez la programmation orientée objet en JavaScript" />
    <title>Apprentissage JavaScript</title>
    <!-- Polices : Salle des trophées (sceaux de cire / hérauts) + Accueil (diagramme UML / éditeur).
         Auto-hébergées via @fontsource, plus aucun appel à un CDN de polices —
         voir src/styles/fonts.css pour les familles et les poids. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
